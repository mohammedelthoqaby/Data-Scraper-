[build]
  publish = "dist"
  command = "npm run build"

# Proxy all /api/* requests to MonsterASP backend with force = true and status = 200
# Cookies stay same-origin on the Netlify domain
[[redirects]]
  from = "/api/*"
  to = "https://lazybean-api.monsterasp.net/api/:splat"
  status = 200
  force = true
  headers = { x-nf-sign = ":NETLIFY_PROXY_SECRET" }

# Proxy /health for monitoring
[[redirects]]
  from = "/health"
  to = "https://lazybean-api.monsterasp.net/health"
  status = 200
  force = true

# Fallback for Astro SPA / client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
