name: Daily Collection Run

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily (07:00 / 08:00 Egypt time)
  workflow_dispatch:

jobs:
  run-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Trigger Internal Collection Run on Server
        id: trigger
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "::error::API_BASE_URL and INTERNAL_TOKEN secrets must be configured in GitHub repository secrets."
            exit 1
          fi

          echo "Triggering daily collection run on $API_BASE_URL..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$API_BASE_URL/api/internal/runs" \
            -H "X-Internal-Token: $INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response status: $HTTP_STATUS"
          echo "Response body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "::error::Failed to trigger run. HTTP $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

          RUN_ID=$(echo "$HTTP_BODY" | jq -r '.runId // .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Initiated collection run with ID: $RUN_ID"

      - name: Run Strong Coffee Collector (GitHub Hosted)
        if: steps.trigger.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          echo "Starting GitHub Actions collector for strong-coffee (Run ID: $RUN_ID)..."
          SUCCESS=0
          for attempt in 1 2; do
            echo "=== Attempt $attempt of 2 ==="
            if dotnet run --project backend/src/LazyBean.CollectorCli -- \
                --run-id "$RUN_ID" \
                --slug "strong-coffee" \
                --api-url "$API_BASE_URL" \
                --token "$INTERNAL_TOKEN"; then
              echo "Collector completed successfully on attempt $attempt."
              SUCCESS=1
              break
            fi
            echo "Attempt $attempt failed. Waiting 10s before retry..."
            sleep 10
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Strong Coffee collector failed after 2 attempts."
            exit 1
          fi
