name: GitHub Actions Collector

on:
  workflow_call:
    inputs:
      run_id: 
        description: 'Collection run GUID'
        required: true
        type: string
      slug:
        description: 'Competitor slug (e.g. strong-coffee)'
        required: false
        default: 'strong-coffee'
        type: string
      slugs:
        description: 'Competitor slugs (comma-separated or single)'
        required: false
        default: 'strong-coffee'
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Collection run GUID'
        required: true
        type: string
      slug:
        description: 'Competitor slug (e.g. strong-coffee)'
        required: false
        default: 'strong-coffee'
        type: string
      slugs:
        description: 'Competitor slugs (comma-separated or single)'
        required: false
        default: 'strong-coffee'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Collector CLI (Max 2 Attempts)
        env:
          RUN_ID: ${{ inputs.run_id }}
          SLUG: ${{ inputs.slug || inputs.slugs || 'strong-coffee' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "::error::API_BASE_URL and INTERNAL_TOKEN secrets must be set."
            exit 1
          fi

          echo "Targeting Run ID: $RUN_ID for competitor: $SLUG"
          SUCCESS=0
          for attempt in 1 2; do
            echo "=== Attempt $attempt of 2 ==="
            if dotnet run --project backend/src/LazyBean.CollectorCli -- \
                --run-id "$RUN_ID" \
                --slug "$SLUG" \
                --api-url "$API_BASE_URL" \
                --token "$INTERNAL_TOKEN"; then
              echo "Collector completed successfully on attempt $attempt."
              SUCCESS=1
              break
            fi
            echo "Attempt $attempt failed. Waiting 10s before retry..."
            sleep 10
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Collector failed after 2 attempts."
            exit 1
          fi
