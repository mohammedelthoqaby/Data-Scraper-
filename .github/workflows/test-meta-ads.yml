name: Test Meta Ads POC

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'Facebook Page ID'
        required: true
        default: '100456846237420'
      country:
        description: 'Country ISO Code'
        required: true
        default: 'EG'
      max_results:
        description: 'Max ads to collect'
        required: true
        default: '50'

jobs:
  test-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/meta-ads/requirements.txt

      - name: Run Meta Ads Collection
        run: |
          python tools/meta-ads/collect.py \
            --page-id "${{ inputs.page_id || '100456846237420' }}" \
            --country "${{ inputs.country || 'EG' }}" \
            --status "ALL" \
            --max-results "${{ inputs.max_results || '50' }}"
