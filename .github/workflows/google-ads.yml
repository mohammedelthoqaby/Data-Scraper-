name: Google Ads Weekly Sync

on:
  schedule:
    - cron: '0 6 * * 0' # 06:00 UTC every Sunday
  workflow_dispatch:

jobs:
  sync-google-ads:
    runs-on: [self-hosted, lazybean-collector]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Python Virtual Environment
        run: |
          $setupPy = "${{ steps.setup-python.outputs.python-path }}"
          if (-not $setupPy -or -not (Test-Path $setupPy)) {
            if ($env:pythonLocation -and (Test-Path (Join-Path $env:pythonLocation "python.exe"))) {
              $setupPy = Join-Path $env:pythonLocation "python.exe"
            } elseif ($env:pythonLocation -and (Test-Path (Join-Path $env:pythonLocation "bin/python.exe"))) {
              $setupPy = Join-Path $env:pythonLocation "bin/python.exe"
            } else {
              Write-Error "Could not find Python executable from actions/setup-python at '${setupPy}' or in pythonLocation '${env:pythonLocation}'."
              exit 1
            }
          }

          if (Test-Path ".venv") {
            $existingPy = if (Test-Path "./.venv/Scripts/python.exe") { "./.venv/Scripts/python.exe" } else { "./.venv/bin/python" }
            if (-not (Test-Path $existingPy)) {
              Write-Host "Existing .venv is incomplete. Recreating..."
              Remove-Item ".venv" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Test-Path ".venv")) {
            & $setupPy -m venv .venv
          }

          if (Test-Path "./.venv/Scripts/python.exe") {
            $venvPy = "./.venv/Scripts/python.exe"
            $venvPip = "./.venv/Scripts/pip.exe"
          } else {
            $venvPy = "./.venv/bin/python"
            $venvPip = "./.venv/bin/pip"
          }

          & $venvPip install --upgrade pip
          & $venvPip install -r tools/google-ads/requirements.txt

      - name: Run Google Ads Sync Pass
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if (-not $env:API_BASE_URL -or -not $env:INTERNAL_TOKEN) {
            Write-Error "API_BASE_URL and INTERNAL_TOKEN secrets must be configured in GitHub repository secrets."
            exit 1
          }

          if (Test-Path "./.venv/Scripts/python.exe") {
            $venvPy = "./.venv/Scripts/python.exe"
          } else {
            $venvPy = "./.venv/bin/python"
          }

          & $venvPy tools/google-ads/sync.py
