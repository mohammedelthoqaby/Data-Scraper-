name: Diagnose Strong Coffee Woo API

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test from GitHub Actions Runner IP (Current UA)
        run: |
          echo "=== 1. Testing Strong Coffee with current User-Agent from GitHub runner ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: LazyBean-Collector/1.0" \
            "https://strongcoffee-eg.com/wp-json/wc/store/v1/products?per_page=100&page=1")
          echo "Current UA status code: $STATUS"

      - name: Test from GitHub Actions Runner IP (Honest UA)
        run: |
          echo "=== 2. Testing Strong Coffee with honest User-Agent from GitHub runner ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: LazyBeanBot/1.0 (+https://lazy-bean.runasp.net)" \
            "https://strongcoffee-eg.com/wp-json/wc/store/v1/products?per_page=100&page=1")
          echo "Honest UA status code: $STATUS"

      - name: Test from MonsterASP Backend (via Diagnostic API)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "API_BASE_URL or INTERNAL_TOKEN not set. Skipping MonsterASP diagnostic check."
            exit 0
          fi

          echo "=== 3. Querying MonsterASP diagnostics endpoint ==="
          RESPONSE=$(curl -s -X GET "$API_BASE_URL/api/internal/diagnostics/strong-coffee" \
            -H "X-Internal-Token: $INTERNAL_TOKEN")
          echo "MonsterASP Diagnostic Result:"
          echo "$RESPONSE"
